<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cantos JPSA</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Encabezado -->
  <header>
    <div class="header-container">
      <h1>🎵 Cantos JPSA</h1>
      <button id="themeToggle" class="theme-btn" aria-label="Cambiar tema">🌙 Modo Oscuro</button>
    </div>
  </header>

  <main>
    <!-- VISTA 1: LISTA Y BUSCADOR -->
    <section id="listView">
      <div class="search-container">
        <input 
          type="search" 
          id="searchInput" 
          class="search-input" 
          placeholder="Buscar por título o frase de la letra..."
          autocomplete="off"
        >
      </div>

      <div id="songList" class="song-list">
        <div class="status-msg">Cargando cantos...</div>
      </div>
    </section>

    <!-- VISTA 2: DETALLE DEL CANTO -->
    <section id="detailView" class="detail-view">
      <!-- Barra de controles -->
      <div class="controls-bar hide-in-lyrics-only">
        <button id="backBtn" class="btn-control">⬅ Volver a la lista</button>
        
        <div class="controls-group">
          <button id="decreaseFontBtn" class="btn-control btn-font" title="Disminuir letra">A-</button>
          <button id="increaseFontBtn" class="btn-control btn-font" title="Aumentar letra">A+</button>
          <button id="copyBtn" class="btn-control">📋 Copiar letra</button>
          <button id="lyricsOnlyBtn" class="btn-control">📺 Solo letra</button>
        </div>
      </div>

      <!-- Tarjeta del canto abierto -->
      <div class="detail-card">
        <div class="detail-header">
          <span id="detailType" class="song-badge">Tipo</span>
          <h2 id="detailTitle" class="detail-title">Título del Canto</h2>
        </div>

        <!-- Reproductor de YouTube -->
        <div id="videoWrapper" class="video-wrapper"></div>

        <!-- Letra formateada -->
        <div id="detailLyrics" class="lyrics-container"></div>
      </div>
    </section>
  </main>

  <!-- Botón flotante para salir del modo "Solo letra" -->
  <button id="exitLyricsOnlyBtn" class="floating-exit-btn">❌ Salir de Solo letra</button>
